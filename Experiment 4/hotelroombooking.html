<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Room Booking</title>
</head>
<body>
    <h1>Hotel Room Booking</h1>

    <form action="#" method="post">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required><br><br>

        <label for="phone">Contact Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your contact number" required><br><br>

        <label for="checkin">Check-in Date:</label>
        <input type="date" id="checkin" name="checkin" required><br><br>

        <label for="checkout">Check-out Date:</label>
        <input type="date" id="checkout" name="checkout" required><br><br>

        <label for="roomtype">Room Type:</label>
        <select id="roomtype" name="roomtype" placeholder="Select room type" required>
            <option value="single">Single</option>
            <option value="double">Double</option>
            <option value="suite">Suite</option>
            <option value="deluxe">Deluxe</option>
        </select><br><br>

        <label for="guests">Number of Guests:</label>
        <input type="number" id="guests" name="guests" min="1" max="10" required><br><br>
        
        <label for="specialrequests">Special Requests:</label><br>
        <textarea id="specialrequests" name="specialrequests" placeholder="Enter any special requests" rows="4" cols="50"></textarea><br><br>

        <input type="submit" value="Confirm Booking">
        <input type="reset" value="Reset">
        <input type="submit" value="Cancel">

    </form>
</body>
</html>
